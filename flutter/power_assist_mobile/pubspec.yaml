name: power_assist_mobile
description: Mobile-first document processing app with Flutter
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP client
  http: ^1.1.0
  dio: ^5.4.0
  
  # State management
  provider: ^6.1.0
  
  # File handling
  file_picker: ^6.1.0
  path_provider: ^2.1.0
  
  # UI components
  flutter_markdown: ^0.6.18
  shimmer: ^3.0.0
  
  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
