[tool.poetry]
name = "power-assist"
version = "0.1.0"
description = "Mobile-first document processing application with Agno framework and Dockling"
authors = ["CzarX86"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
agno = "^0.1.0"
dockling = "^2.0.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.5.0"
python-multipart = "^0.0.6"
aiofiles = "^23.2.1"
pypdf2 = "^3.0.0"
python-pptx = "^0.6.23"
python-docx = "^1.1.0"
markdown = "^3.5.0"
email-validator = "^2.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.12.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
